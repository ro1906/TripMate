{% extends "base.html" %}
{% block title %}New trip · TripMate{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Plan a new trip</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Create trip</button>
    <a href="{% url 'trip_list' %}">Cancel</a>
  </form>
</section>
{% endblock %}
