{% extends "base.html" %}
{% block title %}Log in · TripMate{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
